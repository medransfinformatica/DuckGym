<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Recuperación activa</title>
  <desc id="desc">Animación de una persona trotando muy suave y respirando profundamente para recuperarse tras una serie.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981" stop-opacity=".24"/>
      <stop offset=".55" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#34d399" stop-opacity=".38"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="breath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7f3d0" stop-opacity=".05"/>
      <stop offset="1" stop-color="#6ee7b7" stop-opacity=".6"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <circle cx="320" cy="208" r="152" fill="url(#glow)">
    <animate attributeName="r" values="144;166;144" dur="4.4s" repeatCount="indefinite"/>
  </circle>

  <ellipse cx="320" cy="250" rx="190" ry="126" stroke="#34d399" stroke-opacity=".15" stroke-width="2" stroke-dasharray="4 14">
    <animateTransform attributeName="transform" type="rotate" from="360 320 250" to="0 320 250" dur="42s" repeatCount="indefinite"/>
  </ellipse>

  <g transform="translate(150 272)">
    <path d="M0 0 C-18 30 18 30 0 60 C-18 90 18 90 0 120" stroke="url(#breath)" stroke-width="8" stroke-linecap="round" fill="none" opacity=".55">
      <animate attributeName="opacity" values=".15;.7;.15" dur="4.4s" repeatCount="indefinite"/>
    </path>
    <circle cx="0" cy="120" r="5" fill="#6ee7b7" opacity=".6">
      <animate attributeName="cy" values="120;92;120" dur="4.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.7;0" dur="4.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(492 152)">
    <path d="M0 26 C-18 0 -8 -18 0 -30 C8 -18 18 0 0 26Z" fill="#34d399" opacity=".5">
      <animate attributeName="opacity" values=".2;.65;.2" dur="4.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4.4s" repeatCount="indefinite"/>
    </path>
    <circle cx="38" cy="34" r="3" fill="#6ee7b7" opacity=".5">
      <animate attributeName="cy" values="34;10;34" dur="4.4s" begin="-1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.7;0" dur="4.4s" begin="-1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <line x1="24" y1="340" x2="616" y2="340" stroke="#34d399" stroke-opacity=".22" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="340" x2="616" y2="340" stroke="#d1fae5" stroke-opacity=".4" stroke-width="3" stroke-linecap="round" stroke-dasharray="20 38">
    <animate attributeName="stroke-dashoffset" values="0;-58" dur="1.3s" repeatCount="indefinite"/>
  </line>

  <g transform="translate(320 220)">
    <ellipse cx="0" cy="122" rx="90" ry="12" fill="#020617" opacity=".36"/>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".65s" repeatCount="indefinite"/>

      <g>
        <animateTransform attributeName="transform" type="rotate" values="-20 0 0;22 0 0;-20 0 0" dur="1.3s" repeatCount="indefinite"/>
        <path d="M0 0 L-12 50 L-26 92 L-6 102" stroke="#34d399" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M-6 102 L16 104" stroke="#a7f3d0" stroke-width="10" stroke-linecap="round"/>
      </g>

      <g transform="translate(10 -80)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="24 0 0;-26 0 0;24 0 0" dur="1.3s" repeatCount="indefinite"/>
          <path d="M0 0 L-15 27 L-5 49" stroke="#34d399" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <path d="M0 0 L9 -82" stroke="url(#body)" stroke-width="21" stroke-linecap="round"/>
      <path d="M-4 2 L8 5" stroke="#ecfdf5" stroke-width="13" stroke-linecap="round"/>

      <g>
        <animateTransform attributeName="transform" type="rotate" values="22 0 0;-20 0 0;22 0 0" dur="1.3s" repeatCount="indefinite"/>
        <path d="M0 0 L18 49 L10 92 L32 101" stroke="url(#body)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M32 101 L54 102" stroke="#ecfdf5" stroke-width="11" stroke-linecap="round"/>
      </g>

      <circle cx="26" cy="-106" r="19" fill="#ecfdf5"/>
      <path d="M10 -112 Q26 -122 43 -108" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
      <circle cx="33" cy="-108" r="2.3" fill="#0f172a"/>

      <g transform="translate(10 -80)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-26 0 0;24 0 0;-26 0 0" dur="1.3s" repeatCount="indefinite"/>
          <path d="M0 0 L15 29 L34 21" stroke="#ecfdf5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <g fill="none" stroke="#6ee7b7" stroke-width="2">
        <circle cx="16" cy="-46" r="42" opacity=".26">
          <animate attributeName="r" values="36;54;36" dur="4.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".32;.03;.32" dur="4.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="16" cy="-46" r="58" opacity=".18">
          <animate attributeName="r" values="50;72;50" dur="4.4s" begin="-1.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".22;.01;.22" dur="4.4s" begin="-1.6s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <g fill="#a7f3d0" opacity=".5">
    <circle cx="116" cy="126" r="2.6">
      <animate attributeName="opacity" values=".1;.8;.1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="542" cy="296" r="2.2">
      <animate attributeName="opacity" values=".1;.65;.1" dur="3.8s" begin="-.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
