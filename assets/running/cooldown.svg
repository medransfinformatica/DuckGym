<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Enfriamiento y estiramientos</title>
  <desc id="desc">Animación de una persona estirando el cuádriceps con una respiración calmada y hojas que caen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fdfa"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".34"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <circle cx="320" cy="210" r="150" fill="url(#glow)">
    <animate attributeName="r" values="144;160;144" dur="5.4s" repeatCount="indefinite"/>
  </circle>

  <ellipse cx="320" cy="252" rx="186" ry="122" stroke="#2dd4bf" stroke-opacity=".15" stroke-width="2" stroke-dasharray="4 14">
    <animateTransform attributeName="transform" type="rotate" from="0 320 252" to="360 320 252" dur="52s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="url(#leaf)">
    <path d="M134 74 q14 -16 28 -2 q-14 18 -28 2z">
      <animateTransform attributeName="transform" type="translate" values="0 -20;18 190;6 220" dur="7.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;180;300" dur="7.5s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="0;.75;0" dur="7.5s" repeatCount="indefinite"/>
    </path>
    <path d="M500 60 q12 -14 24 -2 q-12 16 -24 2z">
      <animateTransform attributeName="transform" type="translate" values="0 -10;-24 180;-10 230" dur="9s" begin="-3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;-160;-280" dur="9s" begin="-3s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="0;.65;0" dur="9s" begin="-3s" repeatCount="indefinite"/>
    </path>
    <path d="M566 120 q10 -12 20 -2 q-10 14 -20 2z">
      <animateTransform attributeName="transform" type="translate" values="0 -20;-8 150;-2 210" dur="8.2s" begin="-5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0;140;240" dur="8.2s" begin="-5s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="0;.55;0" dur="8.2s" begin="-5s" repeatCount="indefinite"/>
    </path>
  </g>

  <line x1="24" y1="340" x2="616" y2="340" stroke="#2dd4bf" stroke-opacity=".22" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="340" x2="616" y2="340" stroke="#ccfbf1" stroke-opacity=".35" stroke-width="3" stroke-linecap="round" stroke-dasharray="18 40">
    <animate attributeName="stroke-dashoffset" values="0;-58" dur="3s" repeatCount="indefinite"/>
  </line>

  <g transform="translate(322 222)">
    <ellipse cx="0" cy="120" rx="82" ry="11" fill="#020617" opacity=".34"/>

    <g>
      <animateTransform attributeName="transform" type="translate" values="-2 0;2 0;-2 0" dur="6s" repeatCount="indefinite"/>

      <path d="M0 0 L-8 54 L-46 24" stroke="#2dd4bf" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-46 24 L-60 34" stroke="#99f6e4" stroke-width="10" stroke-linecap="round"/>

      <g transform="translate(10 -82)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="4 0 0;-6 0 0;4 0 0" dur="4.2s" repeatCount="indefinite"/>
          <path d="M0 0 L-20 20 L-48 4" stroke="#f0fdfa" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <path d="M0 0 L10 -82" stroke="url(#body)" stroke-width="21" stroke-linecap="round"/>
      <path d="M-4 2 L8 5" stroke="#f0fdfa" stroke-width="13" stroke-linecap="round"/>

      <path d="M0 0 L8 52 L10 100 L32 104" stroke="url(#body)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M32 104 L54 104" stroke="#f0fdfa" stroke-width="11" stroke-linecap="round"/>

      <circle cx="26" cy="-106" r="19" fill="#f0fdfa"/>
      <path d="M10 -113 Q26 -123 43 -109" stroke="#14b8a6" stroke-width="5" stroke-linecap="round"/>
      <circle cx="33" cy="-108" r="2.3" fill="#0f172a"/>

      <g transform="translate(10 -82)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-6 0 0;6 0 0;-6 0 0" dur="4.2s" repeatCount="indefinite"/>
          <path d="M0 0 L18 -20 L34 -44" stroke="#f0fdfa" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <g fill="none" stroke="#5eead4" stroke-width="2">
        <circle cx="16" cy="-42" r="44" opacity=".22">
          <animate attributeName="r" values="38;56;38" dur="5.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".28;.02;.28" dur="5.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="16" cy="-42" r="60" opacity=".14">
          <animate attributeName="r" values="52;74;52" dur="5.4s" begin="-2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".18;.01;.18" dur="5.4s" begin="-2s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <g fill="#99f6e4" opacity=".5">
    <circle cx="138" cy="288" r="2.4">
      <animate attributeName="opacity" values=".1;.7;.1" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="506" cy="242" r="2">
      <animate attributeName="opacity" values=".1;.6;.1" dur="5s" begin="-.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
