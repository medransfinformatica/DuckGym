<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Tempo controlado</title>
  <desc id="desc">Animación de un corredor a ritmo tempo sostenido con estelas de velocidad y pulso acelerado.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#0f172a" stop-opacity="0"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".34"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="speed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="dial" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <circle cx="320" cy="205" r="150" fill="url(#glow)">
    <animate attributeName="r" values="142;164;142" dur="1.7s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(126 104)">
    <circle r="46" stroke="#fbbf24" stroke-opacity=".2" stroke-width="8"/>
    <path d="M-30 22 A37 37 0 0 1 32 18" stroke="url(#dial)" stroke-width="8" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 150;116 150" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#fde68a" stroke-width="3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-50 0 0;48 0 0;-50 0 0" dur="2.4s" repeatCount="indefinite"/>
    </line>
    <circle r="5" fill="#fde68a"/>
  </g>

  <g stroke-linecap="round" stroke-width="5" opacity=".72">
    <line x1="92" y1="188" x2="204" y2="188" stroke="url(#speed)">
      <animate attributeName="x1" values="128;-8" dur=".78s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="240;104" dur=".78s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;0" dur=".78s" repeatCount="indefinite"/>
    </line>
    <line x1="118" y1="222" x2="214" y2="222" stroke="url(#speed)">
      <animate attributeName="x1" values="150;14" dur=".78s" begin="-.26s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="246;110" dur=".78s" begin="-.26s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.7;0" dur=".78s" begin="-.26s" repeatCount="indefinite"/>
    </line>
    <line x1="74" y1="258" x2="164" y2="258" stroke="url(#speed)">
      <animate attributeName="x1" values="106;-30" dur=".78s" begin="-.52s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="196;60" dur=".78s" begin="-.52s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.5;0" dur=".78s" begin="-.52s" repeatCount="indefinite"/>
    </line>
  </g>

  <line x1="24" y1="340" x2="616" y2="340" stroke="#fbbf24" stroke-opacity=".24" stroke-width="3" stroke-linecap="round"/>
  <line x1="24" y1="340" x2="616" y2="340" stroke="#fef3c7" stroke-opacity=".5" stroke-width="3" stroke-linecap="round" stroke-dasharray="28 32">
    <animate attributeName="stroke-dashoffset" values="0;-60" dur=".78s" repeatCount="indefinite"/>
  </line>

  <g transform="translate(326 222)">
    <ellipse cx="0" cy="120" rx="94" ry="12" fill="#020617" opacity=".38"/>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur=".39s" repeatCount="indefinite"/>

      <g>
        <animateTransform attributeName="transform" type="rotate" values="-34 0 0;38 0 0;-34 0 0" dur=".78s" repeatCount="indefinite"/>
        <path d="M0 0 L-20 46 L-42 78 L-26 102" stroke="#fbbf24" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M-26 102 L-4 110" stroke="#fde68a" stroke-width="10" stroke-linecap="round"/>
      </g>

      <g transform="translate(18 -80)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="38 0 0;-44 0 0;38 0 0" dur=".78s" repeatCount="indefinite"/>
          <path d="M0 0 L-22 22 L-14 46" stroke="#fbbf24" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <path d="M0 0 L20 -80" stroke="url(#body)" stroke-width="22" stroke-linecap="round"/>
      <path d="M-4 2 L10 6" stroke="#fffbeb" stroke-width="14" stroke-linecap="round"/>

      <g>
        <animateTransform attributeName="transform" type="rotate" values="38 0 0;-34 0 0;38 0 0" dur=".78s" repeatCount="indefinite"/>
        <path d="M0 0 L28 40 L22 84 L46 94" stroke="url(#body)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M46 94 L70 94" stroke="#fffbeb" stroke-width="11" stroke-linecap="round"/>
      </g>

      <circle cx="40" cy="-104" r="19" fill="#fff7ed"/>
      <path d="M22 -112 Q40 -122 58 -104" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
      <circle cx="47" cy="-106" r="2.4" fill="#0f172a"/>

      <g transform="translate(18 -80)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-44 0 0;38 0 0;-44 0 0" dur=".78s" repeatCount="indefinite"/>
          <path d="M0 0 L22 26 L46 14" stroke="#fffbeb" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <g stroke="#fbbf24" fill="none" stroke-width="2" opacity=".32">
        <circle cx="26" cy="-48" r="34">
          <animate attributeName="r" values="30;44;30" dur=".78s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".4;.05;.4" dur=".78s" repeatCount="indefinite"/>
        </circle>
        <circle cx="26" cy="-48" r="48">
          <animate attributeName="r" values="44;58;44" dur=".78s" begin="-.28s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".24;.02;.24" dur=".78s" begin="-.28s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>

  <g fill="#fde68a" opacity=".55">
    <circle cx="548" cy="116" r="2.6">
      <animate attributeName="opacity" values=".1;.85;.1" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="510" cy="300" r="2.2">
      <animate attributeName="opacity" values=".1;.7;.1" dur="2.2s" begin="-.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
